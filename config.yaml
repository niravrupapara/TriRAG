project:
  name: TriRAG
  version: "1.0.0"

paths:
  raw: data/raw
  processed: data/processed
  vector: data/vector
  bm25: data/bm25
  graph: data/graph
  eval: data/eval
  logs: logs

chunking:
  strategy: recursive   # options: fixed, recursive
  chunk_size: 512
  chunk_overlap: 50

embeddings:
  model: BAAI/bge-small-en-v1.5
  dimension: 384

retrieval:
  dense_top_k: 10
  final_top_k: 5

bm25:
  k1: 1.5
  b: 0.75
  top_k: 10

reranker:
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_k: 5

llm:
  provider: mistral
  model: mistral-small-latest
  temperature: 0.0
  max_tokens: 1024

graph:
  top_k: 5
  max_hops: 2